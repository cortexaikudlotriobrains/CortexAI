name: CortexAI Production Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  production-deploy:
    name: Approve CortexAI Production
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::051259248984:role/CortexAI-GitHub-ProductionDeploy
          aws-region: us-east-1

      - name: Test locked deployment document
        shell: bash
        run: |
          set -euo pipefail

          # Deliberately invalid target SHA.
          # It satisfies the 40-char SSM format but cannot match origin/develop.
          TEST_SHA="0000000000000000000000000000000000000000"

          COMMAND_ID="$(
            aws ssm send-command \
              --document-name "CortexAI-Production-Deploy" \
              --instance-ids "i-0214c97ed4a33f7da" \
              --parameters \
                "approvedCommit=$TEST_SHA,dbApproved=no,configApproved=no" \
              --comment "SAFE CortexAI deployment control-path test" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM Command ID: $COMMAND_ID"

          # The command is expected to fail safely because the approved SHA
          # does not match origin/develop.
          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0214c97ed4a33f7da"
          WAIT_RESULT=$?
          set -e

          STATUS="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "Status" \
              --output text
          )"

          OUTPUT="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "StandardOutputContent" \
              --output text
          )"

          ERROR_OUTPUT="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "StandardErrorContent" \
              --output text
          )"

          echo
          echo "=== STATUS ==="
          echo "$STATUS"

          echo
          echo "=== OUTPUT ==="
          echo "$OUTPUT"

          if [ -n "$ERROR_OUTPUT" ] && [ "$ERROR_OUTPUT" != "None" ]; then
            echo
            echo "=== STDERR ==="
            echo "$ERROR_OUTPUT"
          fi

          echo
          echo "=== SAFETY ASSERTION ==="

          if echo "$OUTPUT" | grep -q "origin/develop changed after approval"; then
            echo "PASS: deployment stopped at the SHA approval gate."
            echo "NO CODE WAS PULLED."
            echo "NO PROCESS WAS STOPPED."
            echo "NO DATABASE WAS CHANGED."
            echo "NO DEPLOYMENT WAS PERFORMED."
          else
            echo "ERROR: expected SHA safety gate was not observed."
            exit 1
          fi
