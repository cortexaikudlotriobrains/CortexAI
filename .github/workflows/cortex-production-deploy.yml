name: CortexAI Production Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  production-deploy:
    name: Approve CortexAI Production
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::051259248984:role/CortexAI-GitHub-ProductionDeploy
          aws-region: us-east-1

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail

          echo "=== AWS CALLER IDENTITY ==="
          aws sts get-caller-identity

          echo
          echo "Production deploy role assumed successfully."
          echo "NO SSM COMMAND WAS SENT."
          echo "NO EC2 CHANGE WAS MADE."
          echo "NO DEPLOYMENT WAS PERFORMED."
