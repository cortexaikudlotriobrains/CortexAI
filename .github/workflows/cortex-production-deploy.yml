name: CortexAI Production Deploy

on:
  workflow_dispatch:
    inputs:
      approve_db_migration:
        description: "I have reviewed and explicitly approve the database migrations in this release"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

# Prevent overlapping production deployments, including long snapshot waits.
concurrency:
  group: cortexai-production-deploy
  cancel-in-progress: false

jobs:

  # ============================================================
  # PHASE 1
  # Read-only production analysis.
  #
  # NO production environment approval is required here.
  # This role cannot deploy Cortex.
  # ============================================================

  plan:
    name: Analyze Production Deployment
    runs-on: ubuntu-latest

    outputs:
      target_sha: ${{ steps.analyze.outputs.target_sha }}
      migrations: ${{ steps.analyze.outputs.migrations }}
      config_changed: ${{ steps.analyze.outputs.config_changed }}

    steps:
      - name: Require develop branch
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_REF" != "refs/heads/develop" ]; then
            echo "ERROR: Run this deployment workflow from develop only."
            exit 1
          fi

      - name: Configure AWS read-only credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::051259248984:role/CortexAI-GitHub-ProductionRead
          aws-region: us-east-1

      - name: Generate production deployment plan
        id: analyze
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          DB_APPROVAL_INPUT: ${{ inputs.approve_db_migration }}
        run: |
          set -euo pipefail

          echo "================================================="
          echo " CORTEXAI PRODUCTION DEPLOYMENT PLAN"
          echo "================================================="
          echo
          echo "Workflow commit:"
          echo "$WORKFLOW_SHA"
          echo

          COMMAND_ID="$(
            aws ssm send-command \
              --document-name "CortexAI-Production-Plan" \
              --instance-ids "i-0214c97ed4a33f7da" \
              --comment "CortexAI production deployment plan for $WORKFLOW_SHA" \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM Command ID: $COMMAND_ID"

          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0214c97ed4a33f7da"

          WAIT_RESULT=$?

          set -e

          STATUS="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "Status" \
              --output text
          )"

          OUTPUT="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "StandardOutputContent" \
              --output text
          )"

          ERROR_OUTPUT="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "StandardErrorContent" \
              --output text
          )"

          echo
          echo "================================================="
          echo " PRODUCTION PLAN"
          echo "================================================="
          echo "$OUTPUT"

          if [ -n "$ERROR_OUTPUT" ] && [ "$ERROR_OUTPUT" != "None" ]; then
            echo
            echo "=== STDERR ==="
            echo "$ERROR_OUTPUT"
          fi

          if [ "$STATUS" != "Success" ]; then
            echo
            echo "ERROR: Production planning command failed."
            exit 1
          fi

          # ----------------------------------------------------
          # Extract the exact SHA analyzed by the EC2 planner.
          # ----------------------------------------------------

          TARGET_SHA="$(
            printf '%s\n' "$OUTPUT" |
              awk '
                /Target origin\/develop:/ {
                  getline
                  print
                  exit
                }
              ' |
              tr -d '[:space:]'
          )"

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Could not determine target SHA from deployment plan."
            exit 2
          fi

          echo
          echo "Planner target SHA:  $TARGET_SHA"
          echo "Workflow target SHA: $WORKFLOW_SHA"

          # The workflow must approve exactly what the planner analyzed.
          if [ "$TARGET_SHA" != "$WORKFLOW_SHA" ]; then
            echo
            echo "ERROR: develop changed while the deployment plan was being generated."
            echo "Run the workflow again so the plan and deployment SHA are identical."
            exit 3
          fi

          # ----------------------------------------------------
          # Detect migration requirement.
          # ----------------------------------------------------

          if printf '%s\n' "$OUTPUT" |
               grep -q "No database migration files detected."; then
            MIGRATIONS="no"
          else
            MIGRATIONS="yes"
          fi

          # ----------------------------------------------------
          # Detect production configuration contract changes.
          # ----------------------------------------------------

          if printf '%s\n' "$OUTPUT" |
               grep -q ".env.example did not change."; then
            CONFIG_CHANGED="no"
          else
            CONFIG_CHANGED="yes"
          fi

          echo
          echo "=== RELEASE CLASSIFICATION ==="
          echo "Target SHA:            $TARGET_SHA"
          echo "Database migrations:   $MIGRATIONS"
          echo "Config contract change:$CONFIG_CHANGED"

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "migrations=$MIGRATIONS" >> "$GITHUB_OUTPUT"
          echo "config_changed=$CONFIG_CHANGED" >> "$GITHUB_OUTPUT"

          # ----------------------------------------------------
          # Add the full plan to GitHub's deployment summary.
          # This is what you review before approving production.
          # ----------------------------------------------------

          {
            echo "# CortexAI Production Deployment Plan"
            echo
            echo "**Target commit:** \`$TARGET_SHA\`"
            echo
            echo "**Database migrations:** $MIGRATIONS"
            echo
            echo "**Production config review:** $CONFIG_CHANGED"
            echo
            echo "## EC2 Production Analysis"
            echo
            echo '```text'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # DB releases need an affirmative dispatch input, followed by the
          # existing separate GitHub production environment approval.
          # The EC2 apply script independently enforces DB approval, a
          # fresh snapshot, and the exact approved target SHA.
          if [ "$MIGRATIONS" = "yes" ]; then
            echo
            echo "DATABASE MIGRATION RELEASE DETECTED"
            if [ "$DB_APPROVAL_INPUT" != "true" ]; then
              echo "ERROR: Re-run with approve_db_migration enabled after reviewing the plan."
              echo "No production changes have occurred."
              exit 20
            fi
            echo "Explicit database dispatch approval: PRESENT"
            echo "Review the migration filenames/order and ensure production config is ready."
          else
            echo "No new migration files detected. Database snapshot not required."
          fi


  # ============================================================
  # PHASE 2
  #
  # GitHub stops here and asks YOU to approve the
  # production environment.
  #
  # Only after approval can this job receive the AWS
  # ProductionDeploy role.
  # ============================================================

  deploy:
    name: Deploy Approved CortexAI Release

    needs:
      - plan

    runs-on: ubuntu-latest
    timeout-minutes: 95

    environment:
      name: production

    steps:

      - name: Display approved deployment
        shell: bash
        run: |
          echo "================================================="
          echo " APPROVED CORTEXAI DEPLOYMENT"
          echo "================================================="
          echo
          echo "Target commit:"
          echo "${{ needs.plan.outputs.target_sha }}"
          echo
          echo "Database migrations:"
          echo "${{ needs.plan.outputs.migrations }}"
          echo
          echo "Configuration contract changed:"
          echo "${{ needs.plan.outputs.config_changed }}"
          echo
          echo "Database dispatch approval requested:"
          echo "${{ inputs.approve_db_migration }}"

      - name: Configure AWS production credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::051259248984:role/CortexAI-GitHub-ProductionDeploy
          aws-region: us-east-1

      # Only database releases create a new RDS snapshot. This occurs AFTER
      # the production environment approval and BEFORE any SSM write command.
      - name: Create and verify fresh RDS snapshot
        id: snapshot
        if: ${{ needs.plan.outputs.migrations == 'yes' }}
        timeout-minutes: 45
        shell: bash
        env:
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          DB_APPROVAL_INPUT: ${{ inputs.approve_db_migration }}
        run: |
          set -euo pipefail

          if [ "$DB_APPROVAL_INPUT" != "true" ]; then
            echo "ERROR: Database changes have not been explicitly approved."
            exit 20
          fi
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: Invalid approved commit SHA."
            exit 21
          fi

          SNAPSHOT_ID="cortexai-prod-$(date -u +%Y%m%d%H%M%S)-${TARGET_SHA:0:7}"
          echo "Creating a manual snapshot of triobrain-kudlo-ptgdb: $SNAPSHOT_ID"

          aws rds create-db-snapshot \
            --db-instance-identifier triobrain-kudlo-ptgdb \
            --db-snapshot-identifier "$SNAPSHOT_ID" \
            --query 'DBSnapshot.DBSnapshotIdentifier' \
            --output text

          echo "Waiting for snapshot to become available..."
          aws rds wait db-snapshot-available \
            --db-snapshot-identifier "$SNAPSHOT_ID"

          aws rds describe-db-snapshots \
            --db-snapshot-identifier "$SNAPSHOT_ID" \
            --output json > "$RUNNER_TEMP/cortex-rds-snapshot.json"

          python3 - "$RUNNER_TEMP/cortex-rds-snapshot.json" "$SNAPSHOT_ID" "$TARGET_SHA" <<'PYCHECK'
          import json
          import sys
          from datetime import datetime, timedelta, timezone

          data = json.load(open(sys.argv[1], encoding='utf-8'))
          snapshot_id, approved_sha = sys.argv[2:4]
          snapshots = data.get('DBSnapshots', [])
          if len(snapshots) != 1:
              raise SystemExit('Expected exactly one snapshot')
          snap = snapshots[0]
          expected_arn = ('arn:aws:rds:us-east-1:051259248984:'
                          f'snapshot:{snapshot_id}')
          checks = {
              'snapshot ID': snap.get('DBSnapshotIdentifier') == snapshot_id,
              'approved SHA': snapshot_id.endswith('-' + approved_sha[:7]),
              'correct RDS instance': snap.get('DBInstanceIdentifier') == 'triobrain-kudlo-ptgdb',
              'status available': snap.get('Status') == 'available',
              'manual snapshot': snap.get('SnapshotType') == 'manual',
              'account and region': snap.get('DBSnapshotArn') == expected_arn,
          }
          created_at = datetime.fromisoformat(
              snap['SnapshotCreateTime'].replace('Z', '+00:00')
          )
          age = datetime.now(timezone.utc) - created_at
          checks['created recently'] = (-timedelta(minutes=5) <= age <= timedelta(hours=6))
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Snapshot verification failed: ' + ', '.join(failed))
          print('Snapshot verified:', snapshot_id)
          print('Source instance:', snap['DBInstanceIdentifier'])
          print('Status:', snap['Status'])
          PYCHECK

          echo "snapshot_id=$SNAPSHOT_ID" >> "$GITHUB_OUTPUT"
          {
            echo "## Database snapshot"
            echo "Verified manual RDS snapshot: $SNAPSHOT_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy exact approved commit
        id: deploy
        shell: bash
        env:
          TARGET_SHA: ${{ needs.plan.outputs.target_sha }}
          CONFIG_CHANGED: ${{ needs.plan.outputs.config_changed }}
          MIGRATIONS: ${{ needs.plan.outputs.migrations }}
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
          DB_APPROVAL_INPUT: ${{ inputs.approve_db_migration }}
        run: |
          set -euo pipefail

          # GitHub production environment approval is a separate human gate.
          # The dispatch DB checkbox is also required for database releases.
          # If .env.example changed, the operator must stage/review config
          # before granting the production environment approval.

          if [ "$CONFIG_CHANGED" = "yes" ]; then
            CONFIG_APPROVED="yes"
          else
            CONFIG_APPROVED="no"
          fi

          if [ "$MIGRATIONS" = "yes" ]; then
            if [ "$DB_APPROVAL_INPUT" != "true" ]; then
              echo "ERROR: Missing explicit database migration approval."
              exit 20
            fi
            if [[ ! "$SNAPSHOT_ID" =~ ^cortexai-prod-[0-9]{14}-[0-9a-f]{7}$ ]]; then
              echo "ERROR: Missing or invalid verified snapshot ID."
              exit 21
            fi
            if [[ "$SNAPSHOT_ID" != *"-${TARGET_SHA:0:7}" ]]; then
              echo "ERROR: Snapshot ID is not bound to the approved commit."
              exit 22
            fi
            DB_APPROVED="yes"
            SSM_PARAMETERS="approvedCommit=$TARGET_SHA,dbApproved=$DB_APPROVED,configApproved=$CONFIG_APPROVED,snapshotId=$SNAPSHOT_ID"
          elif [ "$MIGRATIONS" = "no" ]; then
            if [ -n "$SNAPSHOT_ID" ]; then
              echo "ERROR: Unexpected snapshot for non-database release."
              exit 23
            fi
            DB_APPROVED="no"
            # Version 2 of the SSM document defaults snapshotId to empty.
            SSM_PARAMETERS="approvedCommit=$TARGET_SHA,dbApproved=$DB_APPROVED,configApproved=$CONFIG_APPROVED"
          else
            echo "ERROR: Unknown migration classification."
            exit 24
          fi

          echo "Deploying exact approved SHA: $TARGET_SHA"
          echo "Database migrations: $MIGRATIONS"
          if [ "$DB_APPROVED" = "yes" ]; then
            echo "Verified snapshot handoff: $SNAPSHOT_ID"
          fi

          COMMAND_ID="$(
            aws ssm send-command \
              --document-name "CortexAI-Production-Deploy" \
              --document-version "2" \
              --instance-ids "i-0214c97ed4a33f7da" \
              --parameters "$SSM_PARAMETERS" \
              --comment "Approved CortexAI production deployment $TARGET_SHA" \
              --query "Command.CommandId" \
              --output text
          )"

          echo
          echo "SSM Command ID: $COMMAND_ID"

          # The default aws ssm waiter can time out before a long build/DB
          # migration finishes. Poll the single command for up to 35 minutes.
          STATUS="Pending"
          for attempt in $(seq 1 210); do
            STATUS="$(
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-0214c97ed4a33f7da" \
                --query "Status" --output text 2>/dev/null || true
            )"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break ;;
            esac
            sleep 10
          done

          STATUS="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "Status" \
              --output text
          )"

          OUTPUT="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "StandardOutputContent" \
              --output text
          )"

          ERROR_OUTPUT="$(
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0214c97ed4a33f7da" \
              --query "StandardErrorContent" \
              --output text
          )"

          echo
          echo "================================================="
          echo " DEPLOYMENT RESULT"
          echo "================================================="
          echo
          echo "Status: $STATUS"
          echo
          echo "$OUTPUT"

          if [ -n "$ERROR_OUTPUT" ] && [ "$ERROR_OUTPUT" != "None" ]; then
            echo
            echo "=== STDERR ==="
            echo "$ERROR_OUTPUT"
          fi

          {
            echo "# CortexAI Production Deployment Result"
            echo
            echo "**Target commit:** \`$TARGET_SHA\`"
            echo
            echo "**SSM status:** $STATUS"
            echo
            echo '```text'
            echo "$OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "Success" ]; then
            echo
            echo "ERROR: Production deployment failed."
            exit 1
          fi

          if ! printf '%s\n' "$OUTPUT" |
               grep -q "DEPLOYMENT COMPLETED"; then
            echo
            echo "ERROR: SSM returned Success but deployment completion marker was not found."
            exit 2
          fi

      - name: Verify public CortexAI health
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking public CortexAI health..."

          for attempt in {1..10}; do

            if HEALTH="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --max-time 15 \
                "https://kudlo.triobrain.com/health"
            )"; then

              echo "$HEALTH"
              echo
              echo "CortexAI public health check PASSED."
              exit 0

            fi

            echo "Health attempt $attempt failed. Retrying..."
            sleep 5

          done

          echo "ERROR: CortexAI public health check failed."
          exit 1

      - name: Deployment completed
        shell: bash
        run: |
          echo
          echo "================================================="
          echo " CORTEXAI PRODUCTION DEPLOYMENT COMPLETE"
          echo "================================================="
          echo
          echo "Production commit:"
          echo "${{ needs.plan.outputs.target_sha }}"
          echo
          echo "Required manual smoke tests:"
          echo "Login"
          echo "Ask"
          echo "Compare"
          echo "History"
          echo "File upload"
          echo "Changed feature"
