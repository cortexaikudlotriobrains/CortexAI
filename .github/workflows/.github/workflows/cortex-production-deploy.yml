name: CortexAI Production Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  production-deploy:
    name: Approve CortexAI Production
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Show production OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(
            curl -fsS \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"

          export OIDC_TOKEN="$(
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE"
          )"

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload.encode()).decode()
          )

          print("=== GitHub Production OIDC Claims ===")

          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "ref_type",
              "event_name",
              "environment",
              "job_workflow_ref"
          ]:
              if key in claims:
                  print(f"{key}: {claims[key]}")
          PY

          unset OIDC_TOKEN

      - name: Deployment disabled during identity verification
        run: |
          echo "Production identity verification completed."
          echo "NO AWS ROLE WAS ASSUMED."
          echo "NO DEPLOYMENT WAS PERFORMED."
