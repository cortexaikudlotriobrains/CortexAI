name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      react_frontend: ${{ steps.filter.outputs.react_frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      db: ${{ steps.filter.outputs.db }}
      shared: ${{ steps.filter.outputs.shared }}
      python_files: ${{ steps.filter.outputs.python_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed component paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          filters: |
            react_frontend:
              - 'frontend-react/**'
              - 'e2e/responsive/**'
              - 'e2e/playwright.mobile.config.mjs'
              - 'e2e/playwright.desktop-ipad.config.mjs'
              - 'e2e/package.json'
              - 'e2e/package-lock.json'
            python:
              - added|modified: '**/*.py'
            backend:
              - 'api/**'
              - 'config/**'
              - 'context/**'
              - 'db/**'
              - 'models/**'
              - 'orchestrator/**'
              - 'server/**'
              - 'tests/**'
              - 'tools/**'
              - 'utils/**'
              - 'run_server.py'
              - 'main.py'
              - 'requirements*.txt'
              - 'pyproject.toml'
            db:
              - 'db/migrations/**'
            shared:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'
              - 'scripts/**'
              - 'README.md'
              - '.env.example'
              - 'pytest.ini'

  backend-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.db == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON_CHANGED_FILES: ${{ needs.detect-changes.outputs.python_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (prod + dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Ruff (lint changed Python files)
        run: |
          if [ -z "$PYTHON_CHANGED_FILES" ]; then
            echo "No changed Python files to lint."
          else
            ruff check $PYTHON_CHANGED_FILES
          fi

      - name: Black (format advisory for changed Python files)
        continue-on-error: true
        run: |
          if [ -z "$PYTHON_CHANGED_FILES" ]; then
            echo "No changed Python files to format-check."
          else
            black --check $PYTHON_CHANGED_FILES
          fi

      - name: MyPy (changed-file type check)
        run: |
          if [ -z "$PYTHON_CHANGED_FILES" ]; then
            echo "No changed Python files to type-check."
          else
            mypy --explicit-package-bases --follow-imports=skip $PYTHON_CHANGED_FILES
          fi

      - name: API contract and boundary regression suites
        run: |
          python -m pytest \
            tests/test_baseline_safety_rails.py \
            tests/test_provider_catalog.py \
            tests/test_client_registry_and_schema_dynamic.py \
            tests/test_fastapi_contract_and_guardrails.py \
            tests/test_dynamic_provider_discovery_e2e.py \
            tests/test_component_boundaries.py \
            -q

      - name: Pricing rate-card regression suite
        run: |
          python -m pytest \
            tests/test_model_rate_cards.py \
            tests/test_database_pricing_model_registry.py \
            -q

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  react-responsive-quality:
    needs: detect-changes
    if: needs.detect-changes.outputs.react_frontend == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend-react/package-lock.json
            e2e/package-lock.json

      - name: Install React and responsive-test dependencies
        run: |
          npm ci --prefix frontend-react
          npm ci --prefix e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: React unit, lint, and build checks
        run: |
          npm run --prefix frontend-react test
          npm run --prefix frontend-react lint
          npm run --prefix frontend-react build

      - name: Mobile responsive suite
        run: npm run --prefix e2e test:mobile

      - name: Desktop and iPad responsive suite
        run: npm run --prefix e2e test:desktop-ipad

  build-react-frontend-artifact:
    needs: [detect-changes, react-responsive-quality]
    if: needs.detect-changes.outputs.react_frontend == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-react/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build React frontend
        run: |
          npm ci --prefix frontend-react
          npm run --prefix frontend-react build

      - name: Package React frontend artifact
        run: python scripts/build_frontend_artifact.py

      - name: Upload React frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-frontend-artifact
          path: |
            dist/frontend-react
            dist/react-frontend-artifact.zip

  build-api-image:
    needs: [detect-changes, backend-quality]
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.db == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f Dockerfile.api -t cortexai-api:ci .

      - name: Export API image metadata artifact
        run: |
          mkdir -p dist
          docker image inspect cortexai-api:ci --format='{{.Id}}' > dist/api-image-id.txt

      - name: Upload API image metadata
        uses: actions/upload-artifact@v4
        with:
          name: api-image-metadata
          path: dist/api-image-id.txt

  security-secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gitleaks CLI
        run: |
          install_dir="$(mktemp -d)"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${install_dir}/gitleaks.tar.gz"
          tar -xzf "${install_dir}/gitleaks.tar.gz" -C "${install_dir}" gitleaks
          sudo install -m 0755 "${install_dir}/gitleaks" /usr/local/bin/gitleaks

      - name: Gitleaks (secrets scanning)
        run: gitleaks dir . --no-banner --redact --exit-code 1
